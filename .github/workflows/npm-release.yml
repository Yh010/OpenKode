name: npm release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Validate, publish the next version, or verify the public release
        type: choice
        default: validate
        options: [validate, publish, verify-public]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      action: ${{ steps.version.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: version
        env:
          RELEASE_ACTION: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' && 'publish' || inputs.action) || 'validate' }}
        run: node scripts/release-version.mjs plan

  build:
    needs: plan
    if: needs.plan.outputs.action == 'validate' || needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Set the version being built and tested
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-version.mjs prepare
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/test/*.test.mjs
      - run: pnpm build
      - run: pnpm pack:cli
      - name: Validate prospective publication
        if: needs.plan.outputs.publish == 'true'
        run: npm publish .cache/npm-release/openkode-*.tgz --dry-run --access public --registry=https://registry.npmjs.org/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: .cache/npm-release/*.tgz
          include-hidden-files: true
          if-no-files-found: error

  verify:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-version.mjs prepare
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Initialize Windows credential storage
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 2
        run: |
          Add-Type -AssemblyName System.Security
          $probe = [Text.Encoding]::UTF8.GetBytes('openkode-ci-credential-check')
          $sealed = [Security.Cryptography.ProtectedData]::Protect($probe, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser)
          $opened = [Security.Cryptography.ProtectedData]::Unprotect($sealed, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser)
          if ([Convert]::ToBase64String($opened) -ne [Convert]::ToBase64String($probe)) { throw 'Windows credential storage check failed' }
          Write-Output 'Windows credential storage is ready.'
      - run: pnpm test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: .cache/npm-release
      - run: pnpm test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-test-${{ matrix.os }}
          path: .cache/npm-release/smoke-report.json
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.21.3 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release
      - name: Publish the tested archive using npm trusted publishing
        run: npm publish ./release/openkode-*.tgz --access public --provenance --registry=https://registry.npmjs.org/

  record:
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.action == 'publish' && (needs.release.result == 'success' || needs.plan.outputs.publish == 'false')
    needs: [plan, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Record the release source commit
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-version.mjs tag

  verify-public:
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.action == 'verify-public' || (needs.plan.outputs.action == 'publish' && (needs.release.result == 'success' || needs.plan.outputs.publish == 'false')))
    needs: [plan, release]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the public version outside the checkout
        shell: bash
        env:
          RELEASE_ACTION: ${{ needs.plan.outputs.action }}
          NEW_PUBLICATION: ${{ needs.plan.outputs.publish }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          for attempt in $(seq 1 15); do
            npm install --global "openkode@$RELEASE_VERSION" --registry=https://registry.npmjs.org/ && break
            if [ "$attempt" = 15 ]; then exit 1; fi
            sleep 30
          done
          npm view "openkode@$RELEASE_VERSION" name version gitHead dist.shasum dist-tags.latest --json --registry=https://registry.npmjs.org/
          if [ "$RELEASE_ACTION" = verify-public ] || [ "$NEW_PUBLICATION" = true ]; then
            test "$(npm view openkode dist-tags.latest --registry=https://registry.npmjs.org/)" = "$RELEASE_VERSION"
          fi
          if [ "$RELEASE_ACTION" = publish ]; then
            test "$(npm view "openkode@$RELEASE_VERSION" gitHead --registry=https://registry.npmjs.org/)" = "$GITHUB_SHA"
          fi
          test "$(openkode --version)" = "$RELEASE_VERSION"
          openkode --help
