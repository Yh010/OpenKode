name: npm release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate, stage the first release, or publish using npm trusted publishing
        type: choice
        default: validate
        options:
          - validate
          - stage
          - publish
          - verify-public

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.action != 'verify-public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm pack:cli
      - name: Check package contents
        run: npm publish .cache/npm-release/openkode-*.tgz --dry-run --access public --registry=https://registry.npmjs.org/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: .cache/npm-release/*.tgz
          include-hidden-files: true
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: .cache/npm-release
      - run: pnpm test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-test-${{ matrix.os }}
          path: .cache/npm-release/smoke-report.json
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: inputs.action == 'stage' || inputs.action == 'publish'
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.21.3 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release
      - name: Stage first release for approval on npmjs.com
        if: inputs.action == 'stage'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Add the npm stage-only token as the NPM_TOKEN repository secret first.'
            exit 1
          fi
          npm stage publish release/openkode-*.tgz --access public --registry=https://registry.npmjs.org/
      - name: Publish through npm trusted publishing
        if: inputs.action == 'publish'
        run: npm publish release/openkode-*.tgz --access public --provenance --registry=https://registry.npmjs.org/

  verify-public:
    if: always() && github.ref == 'refs/heads/main' && (inputs.action == 'verify-public' || (inputs.action == 'publish' && needs.release.result == 'success'))
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the public version outside the checkout
        shell: bash
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          cd "$RUNNER_TEMP"
          for attempt in 1 2 3; do
            npm install --global "openkode@$version" --registry=https://registry.npmjs.org/ && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
          test "$(openkode --version)" = "$version"
          openkode --help
